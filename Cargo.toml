[package]
name = "sample-rust-core"
version = "0.2.0"
edition = "2021"
license = "MIT"

[dependencies]
rust_inside = { package = "rust-inside-annotations", git = "https://github.com/Rust-Inside/rust-inside.git", rev = "a913689d26640048eac9dfce3e268f3593ba31cd" }
reqwest = { version = "0.13", default-features = false, features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12"] }
webpki-roots = "1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
