name: Release sample SDKs

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing core tag to build (leave blank to test the selected branch)
        required: false
        type: string
      dry_run:
        description: Build and validate SDKs without publishing
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  release:
    uses: Rust-Inside/rust-inside/.github/workflows/release-sdk.yml@cb6f0384d7d4eca1e393cc8a373e65a5578c81bf
    with:
      source_tag: ${{ inputs.release_tag }}
      dry_run: ${{ inputs.dry_run || inputs.release_tag == '' }}
      version: ${{ inputs.release_tag == '' && '0.0.0' || '' }}
    secrets:
      distribution_token: ${{ secrets.RUST_INSIDE_RELEASE_TOKEN }}
